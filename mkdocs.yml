site_name: 근거기반 한의학 위키
site_description: Evidence-Based Korean Medicine Wiki
site_url: https://med.symbolicinfo.com
docs_dir: wiki
theme:
  name: material
  language: ko
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.integrate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
plugins:
  - search
  - exclude:
      glob:
        - _template.md
nav:
  - 홈: README.md
  - 최근 업데이트: 최근업데이트.md
  - 기초한의학:
      - 개요: 1_기초한의학/README.md
      - 원전: 1_기초한의학/원전/README.md
      - 진단학: 1_기초한의학/진단학/README.md
      - 한방생리학: 1_기초한의학/한방생리학/README.md
      - 한방병리학: 1_기초한의학/한방병리학/README.md
      - 경락경혈학: 1_기초한의학/경락경혈학/README.md
      - 침구학: 1_기초한의학/침구학/README.md
      - 본초학: 1_기초한의학/본초학/README.md
      - 방제학: 1_기초한의학/방제학/README.md
      - 기공학: 1_기초한의학/기공학/README.md
      - 의사학: 1_기초한의학/의사학/README.md
  - 임상한의학:
      - 개요: 4_임상한의학/README.md
      - 내과:
          - 개요: 4_임상한의학/내과/README.md
          - 비계: 4_임상한의학/내과/비계/README.md
          - 폐계: 4_임상한의학/내과/폐계/README.md
          - 심계: 4_임상한의학/내과/심계/README.md
          - 간계: 4_임상한의학/내과/간계/README.md
          - 신계: 4_임상한의학/내과/신계/README.md
      - 외과: 4_임상한의학/외과/README.md
      - 산부인과: 4_임상한의학/산부인과/README.md
      - 소아과: 4_임상한의학/소아과/README.md
      - 신경정신과: 4_임상한의학/신경정신과/README.md
      - 안이비인후피부과: 4_임상한의학/안이비인후피부과/README.md
      - 침구과: 4_임상한의학/침구과/README.md
      - 추나의학: 4_임상한의학/추나의학/README.md
      - 재활의학:
          - 개요: 4_임상한의학/재활의학/README.md
          - 요통(腰痛, Low Back Pain): 4_임상한의학/재활의학/요통.md
          - 경추통(頸椎痛, Neck Pain): 4_임상한의학/재활의학/경추통.md
      - 사상의학: 4_임상한의학/사상의학/README.md
  - 보건·기타:
      - 개요: 6_보건기타/README.md
      - 예방한의학: 6_보건기타/예방한의학/README.md
      - 한의학 정책·제도: 6_보건기타/한의학정책및제도/README.md
      - 보건학: 6_보건기타/보건학/README.md
