site_name: 근거기반 한의학 위키
site_description: Evidence-Based Korean Medicine Wiki
site_url: https://med.symbolicinfo.com
docs_dir: wiki
theme:
  name: material
  language: ko
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.integrate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
markdown_extensions:
  - admonition
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
plugins:
  - search
  - exclude:
      glob:
        - _template.md
  - awesome-pages
  - htmlproofer:
      enabled: !ENV [CI, false]
  - redirects:
      redirect_maps: {}
  - macros
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
  - git-revision-date-localized:
      enabled: !ENV [CI, false]
      type: date
      locale: ko
      fallback_to_build_date: true
  - glightbox
  - pdf-export:
      enabled_if_env: ENABLE_PDF_EXPORT
  - print-site
extra_javascript:
  - assets/gtag.js
  - assets/external-links.js
# nav는 대분류→중분류→소분류의 3단계에 얽매이지 않고,
# 필요에 따라 4단계 이상의 하위 단계로 자유롭게 뻗어나갈 수 있다.
# 폴더를 새로 만들면 반드시 이 nav에도 반영한다.
nav:
  - 홈: README.md
  - 최근 업데이트: 최근업데이트.md
  - 기초한의학:
      - 개요: 1_기초한의학/README.md
      - 원전: 1_기초한의학/원전/README.md
      - 진단학: 1_기초한의학/진단학/README.md
      - 한방생리학: 1_기초한의학/한방생리학/README.md
      - 한방병리학: 1_기초한의학/한방병리학/README.md
      - 경락경혈학: 1_기초한의학/경락경혈학/README.md
      - 침구학: 1_기초한의학/침구학/README.md
      - 본초학: 1_기초한의학/본초학/README.md
      - 방제학: 1_기초한의학/방제학/README.md
      - 기공학: 1_기초한의학/기공학/README.md
      - 의사학: 1_기초한의학/의사학/README.md
  - 임상한의학:
      - 개요: 4_임상한의학/README.md
      - 내과:
          - 개요: 4_임상한의학/내과/README.md
          - 비계:
              - 개요: 4_임상한의학/내과/비계/README.md
              - 소화불량(消化不良, Dyspepsia): 4_임상한의학/내과/비계/소화불량.md
          - 폐계:
              - 개요: 4_임상한의학/내과/폐계/README.md
              - 감기(感氣, Common Cold): 4_임상한의학/내과/폐계/감기.md
              - 천식(哮喘, Asthma): 4_임상한의학/내과/폐계/천식.md
          - 심계:
              - 개요: 4_임상한의학/내과/심계/README.md
              - 고혈압(高血壓, Hypertension): 4_임상한의학/내과/심계/고혈압.md
          - 간계:
              - 개요: 4_임상한의학/내과/간계/README.md
              - 비알코올성 지방간(非酒精性脂肪肝, Nonalcoholic Fatty Liver Disease): 4_임상한의학/내과/간계/비알코올성지방간.md
          - 신계:
              - 개요: 4_임상한의학/내과/신계/README.md
              - 요실금(尿失禁, Urinary Incontinence): 4_임상한의학/내과/신계/요실금.md
      - 외과: 4_임상한의학/외과/README.md
      - 산부인과:
          - 개요: 4_임상한의학/산부인과/README.md
          - 월경통(月經痛, Dysmenorrhea): 4_임상한의학/산부인과/월경통.md
      - 소아과:
          - 개요: 4_임상한의학/소아과/README.md
          - 야뇨증(夜尿症, Nocturnal Enuresis): 4_임상한의학/소아과/야뇨증.md
      - 신경정신과:
          - 개요: 4_임상한의학/신경정신과/README.md
          - 불면증(不眠症, Insomnia): 4_임상한의학/신경정신과/불면증.md
      - 안이비인후피부과:
          - 개요: 4_임상한의학/안이비인후피부과/README.md
          - 아토피피부염(Atopic Dermatitis): 4_임상한의학/안이비인후피부과/아토피피부염.md
      - 침구과: 4_임상한의학/침구과/README.md
      - 추나의학: 4_임상한의학/추나의학/README.md
      - 재활의학:
          - 개요: 4_임상한의학/재활의학/README.md
          - 요통(腰痛, Low Back Pain): 4_임상한의학/재활의학/요통.md
          - 경추통(頸椎痛, Neck Pain): 4_임상한의학/재활의학/경추통.md
          - 추간판탈출증(椎間盤脫出症, Herniated Nucleus Pulposus): 4_임상한의학/재활의학/추간판탈출증.md
          - 무릎통증(膝痛, Knee Pain): 4_임상한의학/재활의학/무릎통증.md
      - 사상의학: 4_임상한의학/사상의학/README.md
  - 보건·기타:
      - 개요: 6_보건기타/README.md
      - 예방한의학: 6_보건기타/예방한의학/README.md
      - 한의학 정책·제도: 6_보건기타/한의학정책및제도/README.md
      - 보건학: 6_보건기타/보건학/README.md
