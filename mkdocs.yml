site_name: 근거 기반 한의학 위키
site_description: Evidence-Based Korean Medicine Wiki
site_url: https://wiki.symbolicinfo.com
docs_dir: wiki
theme:
  name: material
hooks:
  - hooks/canonical.py
markdown_extensions:
  - admonition
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
plugins:
  - search
  - awesome-pages
  - htmlproofer:
      enabled: !ENV [CI, false]
  - redirects:
      redirect_maps: {}
  - macros
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
  - git-revision-date-localized:
      enabled: !ENV [CI, false]
      type: date
      locale: ko
      fallback_to_build_date: true
  - glightbox
  - open-in-new-tab
  - pdf-export:
      enabled_if_env: ENABLE_PDF_EXPORT
  - print-site
extra_javascript:
  - assets/gtag.js
# nav는 대분류→중분류→소분류의 3단계에 얽매이지 않고,
# 필요에 따라 4단계 이상의 하위 단계로 자유롭게 뻗어나갈 수 있다.
# 폴더를 새로 만들면 반드시 이 nav에도 반영한다.
